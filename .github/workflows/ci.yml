name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/felipef2s/pulso:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  update-config:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo e do atualizador
        uses: actions/checkout@v6
        with:
          path: app
          persist-credentials: false
      - name: Checkout do estado desejado
        uses: actions/checkout@v6
        with:
          repository: felipef2s/pulso-config
          ref: main
          path: config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Atualiza somente a imagem do ambiente selecionado
        env:
          IMAGE: ghcr.io/felipef2s/pulso:${{ github.sha }}
          CONFIG_FILE: ${{ vars.CONFIG_MANIFEST || 'k8s/deployment.yaml' }}
        run: |
          python ./scripts/update_image.py "config/$CONFIG_FILE" "$IMAGE"
      - name: Registra a entrega
        working-directory: config
        env:
          SOURCE_SHA: ${{ github.sha }}
          CONFIG_FILE: ${{ vars.CONFIG_MANIFEST || 'k8s/deployment.yaml' }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -- "$CONFIG_FILE"
          if git diff --cached --quiet; then
            echo "A imagem ja esta registrada."
            exit 0
          fi
          git commit -m "deploy: pulso $SOURCE_SHA"
          git push origin HEAD:main
